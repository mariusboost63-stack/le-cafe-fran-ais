# Annonce la petite info du jour sur le serveur Discord (embed), peu après sa publication à midi, heure de Paris.
# Deux passages à 10 h 03 et 11 h 03 UTC couvrent midi en été comme en hiver ; celui de 13 h 03 UTC rattrape une info
# publiée en retard. Chaque info n'est annoncée qu'une fois (date gardée sur la branche « annonces »).
# Script : outils/annonce_info.py. Secret à ajouter : DISCORD_WEBHOOK_INFO (webhook du salon choisi).
name: Annonce de l'info du jour

on:
  schedule:
    - cron: "3 10 * * *"
    - cron: "3 11 * * *"
    - cron: "3 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: annonce-info
  cancel-in-progress: false

jobs:
  annonce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Dernière annonce
        run: |
          mkdir -p "$RUNNER_TEMP/etat"
          if git fetch -q --depth=1 origin annonces 2>/dev/null; then git show FETCH_HEAD:derniere.txt > "$RUNNER_TEMP/etat/derniere.txt" 2>/dev/null || true; fi
      - name: Annoncer l'info du jour
        id: annonce
        env:
          DISCORD_WEBHOOK_INFO: ${{ secrets.DISCORD_WEBHOOK_INFO }}
        # Code 2 : rien à annoncer (déjà fait, pas encore midi, secret absent), sans faire échouer la tâche
        run: |
          code=0; python3 outils/annonce_info.py infos.json "$RUNNER_TEMP/etat/derniere.txt" || code=$?
          if [ "$code" -eq 0 ]; then echo "faite=1" >> "$GITHUB_OUTPUT"; elif [ "$code" -ne 2 ]; then exit "$code"; fi
      - name: Retenir la date de l'annonce
        if: steps.annonce.outputs.faite
        working-directory: ${{ runner.temp }}/etat
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b annonces
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derniere.txt
          git commit -q -m "Info du jour annoncée sur Discord"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" annonces
