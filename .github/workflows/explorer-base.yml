# TEMPORAIRE (branche de travail uniquement, à ne pas fusionner) : relève la STRUCTURE de la base du bot
# (noms des tables et des colonnes, nombre de lignes), en lecture seule, pour préparer la section DeckFR.
# Aucune donnée de membre n'est affichée. Autorisé par le propriétaire du dépôt.
name: Explorer la base (temporaire)

on:
  push:
    branches: [claude/trusting-shannon-sdtc2p]
    paths: [.github/workflows/explorer-base.yml]

permissions:
  contents: read

jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pymysql==1.1.1
      - name: Structure de la base
        env:
          CAFE_DB_URL: ${{ secrets.CAFE_DB_URL }}
        shell: python
        run: |
          import os, urllib.parse, pymysql
          u = urllib.parse.urlsplit(os.environ["CAFE_DB_URL"].strip().removeprefix("jdbc:"))
          cx = pymysql.connect(host=u.hostname, port=u.port or 3306, database=u.path.strip("/"), user=urllib.parse.unquote(u.username),
                               password=urllib.parse.unquote(u.password or ""), connect_timeout=10, read_timeout=20, charset="utf8mb4")
          with cx.cursor() as c:
              try: c.execute("SET SESSION TRANSACTION READ ONLY")
              except pymysql.MySQLError: pass
              c.execute("SELECT TABLE_NAME, TABLE_ROWS FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() ORDER BY TABLE_NAME")
              tables = c.fetchall()
              print(f"{len(tables)} tables")
              for nom, lignes in tables:
                  c.execute("SELECT COLUMN_NAME, COLUMN_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = %s ORDER BY ORDINAL_POSITION", (nom,))
                  cols = ", ".join(f"{a} {b}" for a, b in c.fetchall())
                  print(f"- {nom} (~{lignes} lignes) : {cols}")
          cx.close()
