# Toutes les heures, lit le top 10 des grains dans la base du bot (en lecture seule) et le publie
# sur la branche « data » (classement.json), que le site affiche. Script : outils/classement.py
# Relève aussi le jeu de cartes DeckFR (deckfr.json, même branche). Script : outils/deckfr.py
# Et les records de tous les temps pour le livre d'or (records.json, même branche). Script : outils/records.py
# Et la Bourse des cartes (bourse.json) et la boîte à idées (idees.json). Scripts : outils/bourse.py, outils/idees.py
# Et les photos de profil de l'équipe (equipe.json). Script : outils/equipe.py
# Secrets à ajouter (Settings → Secrets and variables → Actions) : CAFE_DB_URL et DISCORD_TOKEN.
# Ils ne servent qu'ici : le site n'y a jamais accès.
# Une fois par heure (et pas plus) pour rester dans les 2 000 minutes gratuites de GitHub Actions si le dépôt est privé.
name: Classement des grains

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      recap_test:
        description: "Récap de test : faire l'édition de la semaine tout de suite (recap-test.json), sans la poster sur Discord ni la montrer sur le site"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: classement
  cancel-in-progress: false

jobs:
  classement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer PyMySQL
        run: pip install --quiet pymysql==1.1.1
      # L'historique des classements (une photo par jour, identifiants hachés) sert aux flèches de progression
      # et au champion de la semaine : on reprend celui de la branche data avant les relevés
      - name: Reprendre l'historique
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            # L'historique des classements, des heures d'affluence et les éditions du récap du dimanche
            for f in historique.json affluence.json recap.json; do
              git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/out/$f" 2>/dev/null || rm -f "$RUNNER_TEMP/out/$f"
            done
          fi
      - name: Relever le classement
        env:
          CAFE_DB_URL: ${{ secrets.CAFE_DB_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          HISTORIQUE: ${{ runner.temp }}/out/historique.json
        # Code 2 : rien à publier (secrets absents ou base injoignable), sans faire échouer la tâche
        run: python3 outils/classement.py "$RUNNER_TEMP/out/classement.json" || [ $? -eq 2 ]
      - name: Relever DeckFR
        env:
          CAFE_DB_URL: ${{ secrets.CAFE_DB_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          HISTORIQUE: ${{ runner.temp }}/out/historique.json
        run: python3 outils/deckfr.py "$RUNNER_TEMP/out/deckfr.json" || [ $? -eq 2 ]
      # Les records de tous les temps, pour le livre d'or de la page Classement. Script : outils/records.py
      - name: Relever les records
        env:
          CAFE_DB_URL: ${{ secrets.CAFE_DB_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python3 outils/records.py "$RUNNER_TEMP/out/records.json" || [ $? -eq 2 ]
      # La Bourse des cartes (bourse.json) et la boîte à idées (idees.json). Scripts : outils/bourse.py, outils/idees.py
      - name: Relever la Bourse et la boîte à idées
        env:
          CAFE_DB_URL: ${{ secrets.CAFE_DB_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python3 outils/bourse.py "$RUNNER_TEMP/out/bourse.json" || [ $? -eq 2 ]
          python3 outils/idees.py "$RUNNER_TEMP/out/idees.json" || [ $? -eq 2 ]
      # Les photos de profil de l'équipe, pour la page Équipe. Script : outils/equipe.py
      - name: Relever les photos de l'équipe
        env:
          CAFE_DB_URL: ${{ secrets.CAFE_DB_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python3 outils/equipe.py "$RUNNER_TEMP/out/equipe.json" || [ $? -eq 2 ]
      # Les heures d'affluence : membres en ligne, lus sur l'invitation publique du serveur. Script : outils/affluence.py
      - name: Relever l'affluence
        run: python3 outils/affluence.py "$RUNNER_TEMP/out/affluence.json" || [ $? -eq 2 ]
      # Le récap du dimanche : fait une seule fois, le dimanche à partir de 18 h (heure de Paris), et posté sur Discord
      # avec le webhook DISCORD_WEBHOOK_RECAP. Script : outils/recap.py
      - name: Récap du dimanche
        env:
          CAFE_DB_URL: ${{ secrets.CAFE_DB_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_WEBHOOK_RECAP: ${{ secrets.DISCORD_WEBHOOK_RECAP }}
          DONNEES: ${{ runner.temp }}/out
        run: |
          if [ "${{ inputs.recap_test }}" = "true" ]; then
            python3 outils/recap.py "$RUNNER_TEMP/out/recap-test.json" --test || [ $? -eq 2 ]
          else
            python3 outils/recap.py "$RUNNER_TEMP/out/recap.json" || [ $? -eq 2 ]
          fi
      - name: Publier sur la branche data
        working-directory: ${{ runner.temp }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f out/classement.json ] || [ -f out/deckfr.json ] || [ -f out/records.json ] || [ -f out/bourse.json ] || [ -f out/idees.json ] || [ -f out/affluence.json ] || { echo "Rien à publier"; exit 0; }
          # Un relevé manqué garde la version précédente de son fichier
          if git -C "$GITHUB_WORKSPACE" fetch -q --depth=1 origin data 2>/dev/null; then
            for f in classement.json deckfr.json records.json bourse.json idees.json equipe.json historique.json affluence.json recap.json recap-test.json; do
              [ -f "out/$f" ] || git -C "$GITHUB_WORKSPACE" show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
          fi
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Classement des grains et DeckFR"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      # Republie le site avec la nouvelle liste (dans la même tâche : pas de minute de plus)
      - name: Republier le site
        uses: ./.github/actions/publier-site
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
