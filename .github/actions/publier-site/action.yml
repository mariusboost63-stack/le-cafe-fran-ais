# Publie le site sur Cloudflare Pages (projet « cafe-fr »). Utilisé par publier.yml et à la fin des tâches du
# classement, des événements et du nombre de membres (dans la même tâche, pour ne pas compter une minute de plus).
# Seuls les fichiers du site partent en ligne, pris sur la dernière version de main, avec les dernières listes du
# classement et de DeckFR (branche « data »), des événements et des salons (branche « evenements »). Sans secrets Cloudflare, rien n'est fait.
name: Publier le site
description: Publie les fichiers du site sur Cloudflare Pages
inputs:
  api-token:
    description: Secret CLOUDFLARE_API_TOKEN
    required: false
  account-id:
    description: Secret CLOUDFLARE_ACCOUNT_ID
    required: false
runs:
  using: composite
  steps:
    - name: Rassembler les fichiers du site
      id: site
      shell: bash
      env:
        TOKEN: ${{ inputs.api-token }}
        COMPTE: ${{ inputs.account-id }}
      run: |
        if [ -z "$TOKEN" ] || [ -z "$COMPTE" ]; then echo "::notice::Secrets Cloudflare absents : publication sautée."; exit 0; fi
        site="$RUNNER_TEMP/site"; rm -rf "$site"; mkdir -p "$site"
        # Toujours la dernière version de main, même si un push a eu lieu pendant la tâche
        git fetch -q --depth=1 origin main
        # Le dossier cartes/ (images des cartes DeckFR) n'est publié que s'il existe
        chemins="index.html 404.html robots.txt sitemap.xml infos.json apercu.png cgu mentions-legales infos polices js"
        git cat-file -e FETCH_HEAD:cartes 2>/dev/null && chemins="$chemins cartes"
        # Les images d'aperçu de chaque page (outils/apercus.js)
        git cat-file -e FETCH_HEAD:apercus 2>/dev/null && chemins="$chemins apercus"
        git archive FETCH_HEAD $chemins | tar -x -C "$site"
        # Une copie de index.html par page du site (cafe-fr.com/classement/…), avec son titre et sa description
        git show FETCH_HEAD:outils/pages.py > "$RUNNER_TEMP/pages.py"
        python3 "$RUNNER_TEMP/pages.py" "$site"
        for b in data:classement.json data:deckfr.json data:records.json data:bourse.json data:idees.json data:affluence.json data:recap.json evenements:evenements.json evenements:evenements.ics evenements:salons.json; do
          branche="${b%%:*}"; fichier="${b#*:}"
          if git fetch -q --depth=1 origin "$branche" 2>/dev/null; then git show "FETCH_HEAD:$fichier" > "$site/$fichier" 2>/dev/null || rm -f "$site/$fichier"; fi
        done
        ls -R "$site"
        echo "dossier=$site" >> "$GITHUB_OUTPUT"
    - name: Créer le projet Cloudflare Pages (la première fois)
      if: steps.site.outputs.dossier
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: |
        # Les clés collées dans GitHub gardent parfois un espace ou un retour à la ligne : on les retire
        export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
        export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
        npx --yes wrangler@4.148.0 pages project create cafe-fr --production-branch=main || echo "Création du projet cafe-fr ignorée (il existe peut-être déjà)"
    - name: Publier sur Cloudflare Pages
      if: steps.site.outputs.dossier
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: |
        # Les clés collées dans GitHub gardent parfois un espace ou un retour à la ligne : on les retire
        export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
        export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
        npx --yes wrangler@4.148.0 pages deploy "${{ steps.site.outputs.dossier }}" --project-name=cafe-fr --branch=main --commit-dirty=true
